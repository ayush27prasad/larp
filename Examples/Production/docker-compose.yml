services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orderly
      POSTGRES_USER: orderly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]

  orders-api:
    build: ./services/orders-api
    depends_on: [postgres, inventory, payments]
    environment:
      DATABASE_URL: postgresql://orderly:${POSTGRES_PASSWORD}@postgres/orderly
      INVENTORY_URL: http://inventory:8081
      PAYMENTS_URL: http://payments:8082
    ports: ["8080:8080"]

  inventory:
    build: ./services/inventory
    ports: ["8081:8081"]

  payments:
    build: ./services/payments
    ports: ["8082:8082"]

  notifier:
    build: ./services/notifier
